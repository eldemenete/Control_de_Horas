services:
  - type: web
    name: control-horas-practica
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: control-horas-db
          property: connectionString
      - key: GOAL_HOURS
        value: "360"
      - key: APP_PIN
        sync: false

databases:
  - name: control-horas-db
    plan: free
    databaseName: control_horas
    user: control_horas_user
